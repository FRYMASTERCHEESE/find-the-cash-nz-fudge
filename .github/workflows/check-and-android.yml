name: Check website and build Android preview
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
  android-pr-check:
    needs: check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true
      - run: node scripts/android-assets.mjs
      - run: gradle -p android assembleDebug bundleRelease --no-daemon
      - name: Assert Android's offline pages are exact copies of the published preview
        run: |
          python3 - <<'PY'
          import pathlib,zipfile
          base=pathlib.Path('docs')
          files=('index.html','site.css','mark.svg','sweets.svg','privacy.html','stockists.html','food-and-orders.html')
          with zipfile.ZipFile('android/app/build/outputs/apk/debug/app-debug.apk') as z:
              names={n[len('assets/'):] for n in z.namelist() if n.startswith('assets/')}
              assert names==set(files),names
              for name in files:
                  assert z.read('assets/'+name)==(base/name).read_bytes(),name
              assert b'<form' not in z.read('assets/index.html').lower()
          print('Android fallback exactly matches live Pages source; no commerce or user data is bundled.')
          PY
  android-preview:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true
      - run: node scripts/android-assets.mjs
      - run: gradle -p android assembleDebug bundleRelease --no-daemon
      - name: Verify APK signature and closed preview contents
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/debug/app-debug.apk > build-validation.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging android/app/build/outputs/apk/debug/app-debug.apk >> build-validation.txt
          python3 - <<'PY'
          import pathlib,zipfile
          files=('index.html','site.css','mark.svg','sweets.svg','privacy.html','stockists.html','food-and-orders.html')
          with zipfile.ZipFile('android/app/build/outputs/apk/debug/app-debug.apk') as z:
              names={n.removeprefix('assets/') for n in z.namelist() if n.startswith('assets/')}
              assert names==set(files),names
              for name in files: assert z.read('assets/'+name)==pathlib.Path('docs',name).read_bytes(),name
              assert b'<form' not in z.read('assets/index.html').lower()
          print('APK signature, read-only website parity and offline fallback verified.')
          PY
      - name: Save installable preview in a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          tag="android-preview-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          cp android/app/build/outputs/apk/debug/app-debug.apk Find-The-Cash-NZ-Fudge-preview.apk
          cp android/app/build/outputs/bundle/release/app-release.aab Find-The-Cash-NZ-Fudge-unsigned.aab
          sha256sum Find-The-Cash-NZ-Fudge-preview.apk Find-The-Cash-NZ-Fudge-unsigned.aab > SHA256SUMS.txt
          gh release create "$tag" --draft --target "$GITHUB_SHA" --title "Android test build ${GITHUB_RUN_NUMBER}" --notes "Installable debug APK for testing website-synced prelaunch information with an offline fallback. Unsigned AAB is not Play-ready. No products, payments or sales enabled." Find-The-Cash-NZ-Fudge-preview.apk Find-The-Cash-NZ-Fudge-unsigned.aab SHA256SUMS.txt build-validation.txt
