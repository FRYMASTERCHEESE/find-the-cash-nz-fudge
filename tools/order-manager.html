<!doctype html><html lang="en-NZ"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Private order notebook — FTC NZ</title><style>body{font:16px/1.6 system-ui;max-width:1000px;margin:30px auto;padding:20px;color:#163e35;background:#faf7ef}label{display:block;margin:12px 0}input,textarea,select{font:inherit;max-width:95%;padding:8px}textarea{display:block;width:90%}button{padding:10px;cursor:pointer;margin:5px}article{border-bottom:1px solid #ccc;padding:15px 0}</style><h1>Private order notebook</h1><p>This offline file keeps records in memory only. Import/export your private JSON notebook to keep changes. Never upload customer information to GitHub or a public website. Closing this page discards unsaved changes.</p><label>Import private notebook <input id="import" type="file" accept=".json,application/json"></label><form id="form"><label>Request/order reference <input id="reference" required maxlength="80"></label><label>Customer reply contact <input id="contact" required maxlength="180"></label><label>Stage <select id="stage"><option>Enquiry</option><option>Stock checked</option><option>Customer confirmed</option><option>Dispatched</option><option>Completed</option><option>Cancelled</option><option>Refund / recall follow-up</option></select></label><label>Private notes: pack IDs, batch, quantity, agreed total, delivery terms, confirmation date<textarea id="notes" required maxlength="6000"></textarea></label><button>Save / update record</button></form><button id="export">Download private notebook</button><button id="clear">Clear memory</button><p id="status" role="status"></p><div id="records"></div><script>
const $=id=>document.getElementById(id);let rows=[];const fields=['reference','contact','stage','notes'];function render(){$('records').replaceChildren();for(const r of rows){const a=document.createElement('article'),h=document.createElement('h2'),p=document.createElement('p');h.textContent=r.reference+' · '+r.stage;p.textContent=r.contact+' — '+r.notes;const edit=document.createElement('button');edit.textContent='Edit';edit.onclick=()=>fields.forEach(k=>$(k).value=r[k]);const del=document.createElement('button');del.textContent='Delete';del.onclick=()=>{rows=rows.filter(x=>x!==r);render()};a.append(h,p,edit,del);$('records').append(a)}}$('form').onsubmit=e=>{e.preventDefault();const r=Object.fromEntries(fields.map(k=>[k,$(k).value.trim()]));r.updatedAt=new Date().toISOString();const i=rows.findIndex(x=>x.reference===r.reference);if(i>=0)rows[i]=r;else rows.push(r);render();$('form').reset();$('status').textContent='Saved in memory. Download to keep changes.'};$('export').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(rows,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='private-orders.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);$('status').textContent='Private notebook downloaded. Store securely outside this public repository.'};$('import').onchange=async()=>{try{const r=JSON.parse(await $('import').files[0].text());if(!Array.isArray(r)||!r.every(x=>fields.every(k=>typeof x[k]==='string')))throw Error();rows=r;render();$('status').textContent='Imported into memory.'}catch{$('status').textContent='Invalid notebook.'}};$('clear').onclick=()=>{rows=[];render();$('form').reset();$('status').textContent='Memory cleared. Previously downloaded files are not deleted.'};window.addEventListener('beforeunload',e=>{if(rows.length){e.preventDefault();e.returnValue=''}});
</script></html>
