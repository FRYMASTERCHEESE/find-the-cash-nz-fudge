plugins { id 'com.android.application' }
android {
 namespace 'nz.findthecash.fudge'
 compileSdk 36
 defaultConfig {
  applicationId 'nz.findthecash.fudge'
  minSdk 26
  targetSdk 36
  versionCode 4
  versionName '1.3'
  buildConfigField 'String', 'PREVIEW_URL', '"https://frymastercheese.github.io/find-the-cash-nz-fudge/"'
 }
 buildFeatures { buildConfig true }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 buildTypes { release { minifyEnabled false } }
}


// Android Studio and CI must package the exact same public, read-only docs
// as GitHub Pages. This task intentionally deletes old web/ checkout assets.
tasks.register('syncPublishedPreview', Sync) {
 from(rootProject.file('../docs')) {
  include 'index.html', 'site.css', 'mark.svg', 'sweets.svg',
          'privacy.html', 'stockists.html', 'food-and-orders.html'
 }
 into(file('src/main/assets'))
}
tasks.matching { it.name == 'preBuild' ||
 it.name.matches('merge.*Assets') }.configureEach {
 dependsOn tasks.named('syncPublishedPreview')
}
