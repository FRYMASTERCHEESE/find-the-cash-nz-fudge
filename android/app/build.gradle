plugins { id 'com.android.application' }
android {
 namespace 'nz.findthecash.fudge'
 compileSdk 36
 defaultConfig {
  applicationId 'nz.findthecash.fudge'
  minSdk 26
  targetSdk 36
  versionCode 4
  versionName '1.3'
  buildConfigField 'String', 'PREVIEW_URL', '"https://frymastercheese.github.io/find-the-cash-nz-fudge/"'
 }
